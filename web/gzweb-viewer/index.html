<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CfR Gazebo Viewer</title>
</head>

<body>
    <main>
        <header>
            <div>
                <p class="eyebrow">Command for Racing</p>
                <h1>Speed Course</h1>
            </div>
            <div class="status"><span></span>
                <p id="viewer-status">Loading course</p>
            </div>
        </header>
        <section class="scene-wrap" aria-label="Gazebo speed course">
            <div id="gz-scene"></div>
            <div id="speedometer" class="speedo" role="img" aria-label="Robot speed"></div>
        </section>
        <footer>
            <p>Drag to orbit. Scroll to zoom.</p>
            <div class="viewer-controls">
                <button id="follow-slash" type="button">Follow robot</button>
                <button id="reset-view" type="button">Reset view</button>
                <button id="reset-slash" type="button" disabled>Reset robot</button>
            </div>
        </footer>
        <section class="teleport-controls" aria-labelledby="teleport-heading">
            <div>
                <p class="eyebrow">Robot position</p>
                <h2 id="teleport-heading">Teleport preview</h2>
            </div>
            <div class="pose-inputs">
                <label>X (m)<input id="teleport-x" type="number" step="0.1" value="0" disabled></label>
                <label>Y (m)<input id="teleport-y" type="number" step="0.1" value="0" disabled></label>
                <label>Heading<input id="teleport-heading-degrees" type="number" step="1" min="-180" max="180" value="0"
                        disabled></label>
            </div>
            <div class="teleport-actions">
                <button id="capture-teleport-pose" type="button" disabled>Capture robot position</button>
                <button id="preview-teleport" type="button" disabled>Preview position</button>
                <button id="teleport-slash" type="button" disabled>Teleport robot</button>
            </div>
        </section>
    </main>
    <script type="module" src="/src/main.js"></script>
</body>

</html>

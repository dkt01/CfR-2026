# Obstacle Course training config -- see config.yaml for the Speed Course's.
#
# The objective here is fastest lap, not "stay in the corridor": see
# obstacle_reward.py's docstring for how progress and the finish bonus
# encode that -- and why there is no per-step time cost -- and
# obstacle_env.py's for why perception is camera-only (scan_source: cloud)
# rather than analytic course geometry.
env:
  world_name: cfr_obstacle_course
  pose_topic: /zed/zed_node/pose
  num_lidar_bins: 36
  lidar_fov_deg: 110.0
  lidar_max_range: 6.0
  control_hz: 10.0
  # Set by braking distance against scan range, not by power. The car has no
  # usable braking authority (docs/characterization-results.md 3: every
  # non-zero brake limit stops it *slower* than coasting) so it sheds speed
  # on coast drag alone, ~1.1 m/s^2. Slowing to the ~1.9 m/s a tight corner
  # allows, including the measured 0.19 s dead time, needs 5.1 m from
  # 3.5 m/s but 7.0 m from 4.0 -- and lidar_max_range is 6.0. Above this the
  # car cannot slow for a corner it has not yet seen, so it just crashes.
  # lidar_max_range is the lever if this needs to go up; the two move
  # together. The old 2.0 gave away most of the usable range.
  max_speed: 3.5
  reverse_speed: 0.5
  # A single training attempt's cap, not the competition's full 2-lap run --
  # see obstacle_env.py's module docstring on why training resets far more
  # often than a real run would. Tune once early runs show how far a
  # reasonable policy gets in this much time.
  episode_time_limit_s: 90.0
  # Net progress *round the course* required per window, so spinning and
  # reversing no longer count as getting somewhere (they used to, via an
  # abs()). This doubles as the progress-per-time floor: below 0.1 m/s of
  # course progress the episode is not worth finishing.
  stuck_window_s: 5.0
  stuck_distance: 0.5
  # Counted as a finished lap this far short of the centerline's full
  # length, so a car that crosses the line wide still gets its bonus.
  lap_finish_tolerance_m: 0.5
  # Deal most training episodes in somewhere along the course instead of
  # always on the start line. Without this the car must solve section N
  # before it can even see section N+1, and a 300k-step run is only ~350
  # episodes -- nowhere near enough to reach the back half of a 75 m course,
  # let alone learn it. Evaluation always starts on the line regardless
  # (train_obstacle.py passes start_s=0), so the reported number stays
  # honest. See ObstacleCourseEnv._pick_start_s.
  start_anywhere_prob: 0.8
  # Dealt starts stop this far short of the finish, so "completed a lap"
  # cannot be won by being dropped next to the line.
  start_anywhere_margin_m: 8.0
  # One 110 degree depth scan cannot say which way the car is moving through
  # it, and much of this course looks alike from one. See obstacle_env.py.
  frame_stack: 4
  # A return has to stand this far above the drivable surface the scan has
  # been tracking to count as an obstacle. Without it the scan is a plain
  # height band, and the ramp -- which climbs 0.635 m in 3.3 m -- reads as a
  # wall 2.18 m ahead, indistinguishable from a bale. The car was then
  # penalised for proximity and touch for driving the course as intended,
  # which is why the eval never got past the deck edge at ~8 m however long
  # it trained. See cloud_scan._scan_tracking_the_ground; `python
  # cloud_scan.py` is not the check, the synthetic ramp/bale cases are.
  ground_step: 0.15
  # Off by default: unlike the Speed Course's bale corridor, there is no
  # course geometry here to validate a jittered start pose against, so a
  # jitter that happens to land inside something would go unnoticed until
  # the car cannot move. See ObstacleCourseEnv._pick_start_pose.
  randomize_start: false
  odom_timeout_s: 2.0
  traction: 0.6
  max_steering_rate: 3.5
  # Mandatory in practice -- see obstacle_env.py's module docstring. Needs
  # sensors:=true (CFR_SENSORS=1) on the launch.
  scan_source: cloud
  # Cycle a small pool of precomputed layouts rather than redrawing every
  # reset, so the policy sees varied bucket/hoop placement without spending
  # most of the wall clock on `gz service` calls. See
  # ObstacleCourseEnv._maybe_randomize_layout.
  randomize_layout: true
  layout_seeds: [101, 102, 103, 104, 105, 106, 107, 108, 109, 110]
  episodes_per_layout: 5
  # Above _call_service's own 8 s default: randomize triggers ~12 sequential
  # `gz service` calls inside obstacle_randomizer_node, whose own latency
  # already nears 8 s on a quiet host and blew past it when another training
  # run's Gazebo server shared the same CPU (observed TimeoutError).
  # 30 s was itself blown past once CPU contention got heavy enough to push
  # several of those dozen calls each toward their own multi-second cap
  # (observed: "/obstacle_randomizer/randomize timed out" after 30 s).
  randomize_timeout_s: 60.0
  # Same host-CPU-contention failure mode as randomize_timeout_s, hitting the
  # teleport HTTP call instead: default 5 s (x3 retries) timed out mid-run
  # when the other training container's Gazebo server spiked to 225% CPU.
  # 20 s, then 60 s, were each still too tight -- the other container's CPU
  # use is spiky (observed 237% mid-spike vs. this one's 20%), not steady, so
  # keep this comfortably above teleport_api.py's own `gz service --timeout`
  # (now 120 s, worst case 122 s) rather than matching it, or a spike puts
  # both sides at their deadline together and every retry loses the race.
  teleport_timeout_s: 150.0
zed_sim:
  enabled: true
  hfov_deg: 110.0
  noise_a: 0.01
  noise_b: 0.008
  dropout_prob: 0.03
reward:
  # See obstacle_reward.py. The headline numbers: the lap is ~75 m, so
  # finishing one banks ~750 in progress, a 300 bonus, and 10 per second of
  # the 90 s cap left unused (+530 for a 37 s lap).
  #
  # There is deliberately NO per-step time cost, and stuck_penalty is 0.
  # Both previous runs died because the per-step floor was negative, so
  # ending the episode early beat playing it out and PPO learned to quit --
  # run `python obstacle_reward.py`, which now asserts an idle car scores
  # exactly 0 a step. Do not reintroduce a k_time here.
  k_progress: 10.0
  lap_bonus: 300.0
  k_finish_speed: 10.0
  stuck_penalty: 0.0
  k_proximity: 1.0
  # Tuned against this course's actual geometry, not guessed: the tightest
  # bucket pair leaves 0.63 m for a 0.30 m car (the env logs it every
  # layout), i.e. 0.165 m a side. The old 0.15 m touch_clearance at k_touch
  # 80 billed up to 7.2 a step -- twice the best possible step of progress
  # -- for threading a gap exactly as intended.
  safe_clearance: 0.25
  k_touch: 30.0
  touch_clearance: 0.08
  collision_clearance: 0.06
  # Modest on purpose. A collision ends the episode, which already forfeits
  # the rest of the lap plus both finish bonuses -- that is the real
  # deterrent. At 300 on top, sitting still (0) beat attempting the course
  # and crashing (-300), and the first rollout after dealt starts went in
  # came back at -296. See assert_attempting_beats_freezing.
  collision_penalty: 50.0
  hoop_miss_penalty: 150.0
  hoop_pass_bonus: 30.0
  k_smooth: 0.05
  k_steer_reversal: 0.8
training:
  total_timesteps: 300000
  # Was 512, which is only about five episodes of this course per update --
  # a small, high-variance batch for a single environment whose episodes end
  # anywhere from 2 to 15 m in. Four times the rollout buys a gradient
  # estimate that is not dominated by which handful of dealt starts came up.
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  gae_lambda: 0.95
  learning_rate: 0.0003
  # 0.01 was set after run 1's log std collapsed (0.67 -> 0.47) while the
  # policy grew certain about standing still. That collapse was the
  # *inverted reward* doing its work, not too little exploration -- standing
  # still genuinely was optimal then. The reward no longer pays for that and
  # obstacle_reward.py asserts it cannot, so the entropy floor is now
  # solving a problem that does not exist, and it costs: 50k steps in, std
  # is still 0.995, essentially where it started. The policy never commits,
  # and a car whose steering is redrawn from a unit normal every control
  # step cannot make progress -- measured on the open start straight, that
  # noise alone costs 36% of speed and half the net displacement against
  # driving straight. Lowered rather than removed: some pressure is still
  # wanted, just not enough to pin the policy at its initialisation.
  ent_coef: 0.002

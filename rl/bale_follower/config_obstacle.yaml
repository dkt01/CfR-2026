# Obstacle Course training config -- see config.yaml for the Speed Course's.
#
# The objective here is fastest lap, not "stay in the corridor": see
# obstacle_reward.py's docstring for how k_time/k_progress encode that, and
# obstacle_env.py's for why perception is camera-only (scan_source: cloud)
# rather than analytic course geometry.
env:
  world_name: cfr_obstacle_course
  pose_topic: /zed/zed_node/pose
  num_lidar_bins: 36
  lidar_fov_deg: 110.0
  lidar_max_range: 6.0
  control_hz: 10.0
  # Set by braking distance against scan range, not by power. The car has no
  # usable braking authority (docs/characterization-results.md 3: every
  # non-zero brake limit stops it *slower* than coasting) so it sheds speed
  # on coast drag alone, ~1.1 m/s^2. Slowing to the ~1.9 m/s a tight corner
  # allows, including the measured 0.19 s dead time, needs 5.1 m from
  # 3.5 m/s but 7.0 m from 4.0 -- and lidar_max_range is 6.0. Above this the
  # car cannot slow for a corner it has not yet seen, so it just crashes.
  # lidar_max_range is the lever if this needs to go up; the two move
  # together. The old 2.0 gave away most of the usable range.
  max_speed: 3.5
  reverse_speed: 0.5
  # A single training attempt's cap, not the competition's full 2-lap run --
  # see obstacle_env.py's module docstring on why training resets far more
  # often than a real run would. Tune once early runs show how far a
  # reasonable policy gets in this much time.
  episode_time_limit_s: 90.0
  # Net progress *round the course* required per window, so spinning and
  # reversing no longer count as getting somewhere (they used to, via an
  # abs()). This doubles as the progress-per-time floor: below 0.1 m/s of
  # course progress the episode is not worth finishing.
  stuck_window_s: 5.0
  stuck_distance: 0.5
  # Counted as a finished lap this far short of the centerline's full
  # length, so a car that crosses the line wide still gets its bonus.
  lap_finish_tolerance_m: 0.5
  # One 110 degree depth scan cannot say which way the car is moving through
  # it, and much of this course looks alike from one. See obstacle_env.py.
  frame_stack: 4
  # Off by default: unlike the Speed Course's bale corridor, there is no
  # course geometry here to validate a jittered start pose against, so a
  # jitter that happens to land inside something would go unnoticed until
  # the car cannot move. See ObstacleCourseEnv._pick_start_pose.
  randomize_start: false
  odom_timeout_s: 2.0
  traction: 0.6
  max_steering_rate: 3.5
  # Mandatory in practice -- see obstacle_env.py's module docstring. Needs
  # sensors:=true (CFR_SENSORS=1) on the launch.
  scan_source: cloud
  # Cycle a small pool of precomputed layouts rather than redrawing every
  # reset, so the policy sees varied bucket/hoop placement without spending
  # most of the wall clock on `gz service` calls. See
  # ObstacleCourseEnv._maybe_randomize_layout.
  randomize_layout: true
  layout_seeds: [101, 102, 103, 104, 105, 106, 107, 108, 109, 110]
  episodes_per_layout: 5
  # Above _call_service's own 8 s default: randomize triggers ~12 sequential
  # `gz service` calls inside obstacle_randomizer_node, whose own latency
  # already nears 8 s on a quiet host and blew past it when another training
  # run's Gazebo server shared the same CPU (observed TimeoutError).
  # 30 s was itself blown past once CPU contention got heavy enough to push
  # several of those dozen calls each toward their own multi-second cap
  # (observed: "/obstacle_randomizer/randomize timed out" after 30 s).
  randomize_timeout_s: 60.0
  # Same host-CPU-contention failure mode as randomize_timeout_s, hitting the
  # teleport HTTP call instead: default 5 s (x3 retries) timed out mid-run
  # when the other training container's Gazebo server spiked to 225% CPU.
  # 20 s, then 60 s, were each still too tight -- the other container's CPU
  # use is spiky (observed 237% mid-spike vs. this one's 20%), not steady, so
  # keep this comfortably above teleport_api.py's own `gz service --timeout`
  # (now 120 s, worst case 122 s) rather than matching it, or a spike puts
  # both sides at their deadline together and every retry loses the race.
  teleport_timeout_s: 150.0
zed_sim:
  enabled: true
  hfov_deg: 110.0
  noise_a: 0.01
  noise_b: 0.008
  dropout_prob: 0.03
reward:
  # See obstacle_reward.py. The headline numbers: the lap is ~75 m, so
  # finishing one banks ~750 in progress plus a 300 bonus, against ~-185 of
  # time cost for a 37 s lap. Standing still until the stuck detector fires
  # scores -225. The previous tuning had those the other way round, which is
  # why the last run learned to stand still -- run `python obstacle_reward.py`
  # for the whole-episode ordering check that now guards this.
  k_progress: 10.0
  k_time: 5.0
  lap_bonus: 300.0
  stuck_penalty: 200.0
  k_proximity: 1.0
  safe_clearance: 0.35
  k_touch: 80.0
  touch_clearance: 0.15
  collision_clearance: 0.06
  collision_penalty: 300.0
  hoop_miss_penalty: 500.0
  hoop_pass_bonus: 30.0
  k_smooth: 0.05
  k_steer_reversal: 0.8
training:
  total_timesteps: 300000
  n_steps: 512
  batch_size: 64
  gamma: 0.99
  gae_lambda: 0.95
  learning_rate: 0.0003
  # Was 0.0, and the policy's log std duly collapsed (0.67 -> 0.47) as it
  # grew more and more certain about standing still. Some entropy pressure
  # keeps it exploring long enough to find that driving pays.
  ent_coef: 0.01

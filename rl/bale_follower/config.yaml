env:
  world_name: cfr_speed_course
  num_lidar_bins: 36
  lidar_fov_deg: 180.0
  # Braking distance is what caps max_speed below, so this is the lever that
  # raises it: the car cannot slow for a corner it cannot yet see. Raise both
  # together, and only once the ZED's usable depth range on a straw bale has
  # actually been measured at the new value.
  lidar_max_range: 6.0
  control_hz: 10.0
  # THE CAR HAS NO BRAKES (docs/characterization-results.md 3), so it sheds
  # speed on coast drag alone: m dv/dt = -(2.18 + 0.47 v), about 1.1 m/s^2 at
  # this speed. Slowing from 3.5 m/s to the 1.9 m/s the tightest hairpin
  # allows takes 5.14 m including the measured 0.19 s command dead time,
  # against the 6.0 m the scan can see. At 4.0 m/s it takes 6.95 m -- further
  # than the car can see, so the corner arrives before the car can react.
  # Power is not the constraint: the measured feedforward map saturates near
  # 8.9 m/s and cmd_vel_to_drive clamps at 8.0.
  max_speed: 3.5
  reverse_speed: 0.5
  # Long enough for a full lap with margin (110.1 m at the ~3 m/s this
  # envelope allows is ~37 s); min_progress_speed is what actually ends a bad
  # episode, so this only has to stop a good one from running forever.
  episode_time_limit_s: 120.0
  # Progress/time floor, measured as centerline arc length per second over a
  # rolling window. An episode that cannot hold this is not learning to lap.
  progress_window_s: 5.0
  min_progress_speed: 1.0
  randomize_start: true
  odom_timeout_s: 2.0
  # Above teleport_api's own GZ_SERVICE_TIMEOUT_MS (120 s). Below it, the HTTP
  # client gives up first and the server's patience is wasted -- which is how
  # two chunks of the last run died.
  teleport_timeout_s: 150.0
  # Lateral grip measured at >= 0.55 g (5.39 m/s^2 peak, a lower bound -- the
  # skidpad sweep stayed below the slide limit by design).
  traction: 0.6
  max_steering_rate: 3.5
  scan_source: analytic
zed_sim:
  enabled: true
  hfov_deg: 110.0
  noise_a: 0.01
  noise_b: 0.008
  dropout_prob: 0.03
smoother:
  enabled: true
  max_steering_rate: 3.5
  w_speed: 20.0
  w_steer: 80.0
  w_accel: 0.002
  w_steer_rate: 0.001
reward:
  # Per metre of centerline arc length. Episodes are time-limited and the loop
  # is closed, so total arc length gained IS average lap pace -- there is no
  # separate time cost to balance against the collision penalty.
  k_progress: 10.0
  k_proximity: 2.0
  k_smooth: 0.05
  # A crash already forfeits every metre left in the episode -- `terminated`
  # zeroes the value bootstrap -- so this only has to stop a crash being an
  # escape from a bad episode. See reward.py for the full argument.
  #
  # It was 200, which the policy could not get past: driving only beats
  # circling once the car survives collision_penalty / k_progress metres, and
  # at 200 that is 20 m against the ~8 m a fresh policy manages. At 50 the
  # break-even is 5 m, inside what the policy can already do.
  collision_penalty: 50.0
  safe_clearance: 0.35
  k_touch: 120.0
  touch_clearance: 0.15
  k_steer_reversal: 0.8
training:
  total_timesteps: 200000
  n_steps: 512
  batch_size: 64
  gamma: 0.99
  gae_lambda: 0.95
  learning_rate: 0.0003
  ent_coef: 0.0

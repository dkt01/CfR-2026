env:
  world_name: cfr_speed_course
  num_lidar_bins: 36
  lidar_fov_deg: 180.0
  lidar_max_range: 6.0
  control_hz: 10.0
  max_speed: 2.0
  # Ceiling on clear straights; curves stay at max_speed.
  straight_speed: 4.5
  reverse_speed: 0.5
  episode_time_limit_s: 60.0
  stuck_window_s: 5.0
  stuck_distance: 0.5
  randomize_start: true
  odom_timeout_s: 2.0
  # Observation through the same point-cloud path the robot uses.
  scan_source: analytic
  traction: 0.6
  max_steering_rate: 3.5
zed_sim:
  enabled: true
  hfov_deg: 110.0
  noise_a: 0.01
  noise_b: 0.008
  dropout_prob: 0.03
smoother:
  enabled: true
  max_steering_rate: 3.5
  w_speed: 20.0
  w_steer: 80.0
  w_accel: 0.002
  w_steer_rate: 0.001
reward:
  k_progress: 10.0
  k_proximity: 1.0
  k_smooth: 0.05
  # Raised from 2.0: staying centred is now a first-class objective rather
  # than a tiebreak, which is what buys clearance at the boosted speeds.
  k_center: 6.0
  collision_penalty: 100.0
  safe_clearance: 0.35
  # Brushing a bale, short of a logged collision.
  k_touch: 40.0
  touch_clearance: 0.10
  # Charges for reversing the steering, which is the left-right sawing.
  k_steer_reversal: 0.8
training:
  total_timesteps: 120000
  n_steps: 512
  batch_size: 64
  gamma: 0.99
  gae_lambda: 0.95
  learning_rate: 0.0003
  ent_coef: 0.0

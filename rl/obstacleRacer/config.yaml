# Obstacle Racer -- one lap of the Obstacle Course, through all three hoops,
# as fast as the car can do it without touching anything.
#
# `plant` is the real car, copied from rl/formulaOne/config.yaml, which took it
# from jetson/cfr_arduino_bridge/config/vehicle.yaml and arduino_bridge.yaml.
# Change them there first and copy them here, never the other way round.
# The suspension and geometry are in plant.py, read off the Gazebo vehicle.

plant:
  speed_slew_rate: 2.0      # m/s^2, arduino_bridge.yaml; binds below max_accel
  max_speed: 8.0            # bridge clamp; the policy's own cap is env.v_cap
  command_dead_time: 0.19   # s
  mass: 3.599
  coast_f0: 2.18            # N      m dv/dt = -(f0 + f1 v).  NO BRAKES.
  coast_f1: 0.47            # N/(m/s)
  max_accel: 3.0            # m/s^2
  understeer_gradient: 0.007
  tire_scrub: 1.10
  yaw_response_tau: 0.34    # s, fitted to Gazebo step-steer (formulaOne)
  steering_tau: 0.05        # s
  steering_slew: 6.16       # rad/s road wheel

env:
  control_hz: 20.0
  substeps: 10              # plant at 200 Hz; suspension modes are ~2.5 Hz
  # Sight-limited, not power-limited: with no brakes the car has to be able to
  # shed speed for what it can see, and the segmenter sees 6 m.
  v_cap: 3.5                # m/s
  episode_s: 120.0          # one full lap from any start point
  # Where episodes start.  Eval always starts in the start box.
  start_box_prob: 0.30
  start_xy_noise: 0.10      # m, uniform +/- in x and in y
  start_yaw_noise_deg: 5.0  # uniform +/-
  dealt_speed: [0.0, 2.0]   # m/s for starts dealt part way round
  deal_on_helix: true
  # Half the dealt starts go a few meters before a spot where a recent
  # training episode failed, so the hard obstacles get practiced.
  fail_start_prob: 0.5
  fail_backoff_m: [0.5, 6.0]
  fail_memory: 400          # failures remembered per layout
  # Terminations.
  stall_speed: 0.25         # m/s
  stall_s: 2.5
  progress_window_s: 6.0    # truncate if s advanced less than...
  progress_window_m: 0.5    # ...this over the window (going round, not along)
  off_course_m: 2.2         # m from the centerline: left the lane (the bucket
                            # section and east corridor are ~3 m wide)
  frame_stack: 2

sensor:
  bins: 36
  fov_deg: 110.0
  max_range: 6.0
  min_range: 0.30           # ZED minimum depth, as the segmenter's min_depth
  vfov_deg: 77.3            # 640 x 360 at 110 deg horizontal
  camera_forward: 0.315
  camera_height: 0.20
  ray_step: 0.02
  rays_per_bin: 2
  # zed_cloud_noise_node: sigma = a + b r^2 on every point; a bin reports the
  # nearest of many, which the speckle filter trims.  Refit from the fixtures.
  noise_a: 0.01
  noise_b: 0.008
  bin_noise_scale: 0.5
  dropout: 0.02             # fraction of bins reading max range
  phantom: 0.005            # fraction of bins reading a near phantom
  carwash_misread_range: 2.0   # m: beyond this the car wash can read solid
  carwash_misread_prob: 0.3
  attitude_noise_deg: 1.0   # IMU pitch/roll error used for leveling
  gate_max_range: 5.0
  gate_frame_margin_deg: 3.0

prior:
  # Follow-the-gap on the blocking scan, or the nearest visible gate's center.
  gate_gain: 1.1            # road-wheel rad per rad of gate bearing
  gap_gain: 1.1             # road-wheel rad per rad of gap bearing
  gap_min_depth: 1.5        # m: a bin this deep or deeper is "open"
  straight_bias: 0.15       # prefer gaps near dead ahead
  yaw_damping: 0.45         # road-wheel rad per rad/s of yaw rate (swept, see prior_sweep)
  residual_scale: 1.0       # policy steering = prior + this * a0; v1's 0.5
                            # could not turn in early enough for the helix
  smoothing_s: 0.15         # low-pass on the prior's command

reward:
  progress: 6.0             # per meter of centerline
  time: 3.0                 # per second; break-even 0.5 m/s
  hoop: 20.0                # per hoop threaded
  finish: 150.0             # must beat a fast run that crashes near the end
  finish_pace: 2.0          # per second under target_lap_s
  target_lap_s: 60.0
  crash: -40.0
  hoop_miss: -40.0
  stall: -20.0
  off_course: -40.0
  graze: 15.0               # per s, times bite^2
  graze_band: 0.12          # m
  steer_rate: 0.04          # * dcmd^2 / dt
  steer_jerk: 0.05          # * ddcmd^2 / dt (0.15 swamped every other term
                            # while the policy's exploration noise was high)
  lateral: 0.0              # off by default: randomized buckets need a free line

randomize:
  enabled: true
  dead_time: [0.13, 0.26]
  coast_scale: [0.80, 1.20]
  accel_scale: [0.80, 1.20]
  slew_scale: [0.75, 1.25]
  steer_gain: [0.82, 1.10]
  steer_asymmetry: [0.85, 1.15]
  steer_offset: [-0.035, 0.035]
  steer_limit: [0.38, 0.55]
  understeer: [0.0, 0.02]
  scrub_scale: [0.90, 1.15]
  yaw_tau_scale: [0.6, 1.6]
  steering_tau: [0.04, 0.08]
  action_dropout: [0.0, 0.05]
  # New for this course: surface grip and the suspension.  mu_scale multiplies
  # the surface mu (1.0 floor, 0.35 gravel) -- refit by fit_surfaces.py.
  mu_scale: [0.80, 1.10]
  spring_scale: [0.85, 1.15]
  damping_scale: [0.75, 1.30]
  yaw_rate_noise: [0.0, 0.03]   # rad/s, 1 sigma
  speed_noise: [0.0, 0.05]      # m/s, 1 sigma, above the tach floor

train:
  total_steps: 150000000   # ~9 h; v1's 30M saw the helix too rarely
  n_envs: 256
  n_steps: 64
  batch_size: 4096
  n_epochs: 4
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005
  learning_rate: 3.0e-4
  lr_final_fraction: 0.05
  net_arch: [128, 128]
  log_std_init: -1.0
  eval_every_steps: 2000000
  eval_episodes_per_layout: 8

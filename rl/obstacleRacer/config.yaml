# Obstacle Racer -- one lap of the Obstacle Course, through all three hoops,
# as fast as the car can do it.  Touching something costs; stopping ends it.
#
# `plant` is the real car, copied from rl/formulaOne/config.yaml, which took it
# from jetson/cfr_arduino_bridge/config/vehicle.yaml and arduino_bridge.yaml.
# Change them there first and copy them here, never the other way round.
# The suspension and geometry are in plant.py, read off the Gazebo vehicle.

plant:
  speed_slew_rate: 2.0      # m/s^2, arduino_bridge.yaml; binds below max_accel
  max_speed: 8.0            # bridge clamp; the policy's own cap is env.v_cap
  command_dead_time: 0.19   # s
  mass: 3.599
  coast_f0: 2.18            # N      m dv/dt = -(f0 + f1 v).  NO BRAKES.
  coast_f1: 0.47            # N/(m/s)
  max_accel: 3.0            # m/s^2
  understeer_gradient: 0.007
  tire_scrub: 1.10
  yaw_response_tau: 0.34    # s, fitted to Gazebo step-steer (formulaOne)
  steering_tau: 0.05        # s
  steering_slew: 6.16       # rad/s road wheel
  # Reverse, as the Arduino's SpeedController does it: a reverse target while
  # rolling forward is a zero target, so the car COASTS -- reversing does not
  # slow it faster, and there is no braking (docs/characterization-results.md
  # section 3: every Brake Limit stopped the car slower than coasting).  Once
  # the car is under the tach's 0.3 m/s floor for reverse_wait (0.4 s tach
  # timeout + 0.1 s), it drives backwards, on the same drag and feedforward
  # curves (fwd/rev 3% apart, sections 1-2).
  reverse_wait: 0.5         # s under 0.3 m/s before the direction changes

env:
  control_hz: 20.0
  substeps: 10              # plant at 200 Hz; suspension modes are ~2.5 Hz
  # Sight-limited, not power-limited: with no brakes the car has to be able to
  # shed speed for what it can see, and the segmenter sees 6 m.
  v_cap: 3.5                # m/s
  v_reverse: 1.0            # m/s; the speed action runs -v_reverse..v_cap
  # One full lap from any start point.  A lap at 1 m/s average (with time to
  # back off a wall or two) fits; v2's runs averaged 1.6 m/s.
  episode_s: 150.0
  # Where episodes start.  Eval always starts in the start box.
  start_box_prob: 0.20
  start_xy_noise: 0.10      # m, uniform +/- in x and in y
  start_yaw_noise_deg: 5.0  # uniform +/-
  dealt_speed: [0.0, 2.0]   # m/s for starts dealt part way round
  deal_on_helix: true
  # Dealt starts: some a few meters before a spot where a recent training
  # episode failed, some a few meters before an obstacle picked uniformly
  # from all of them (so every obstacle is practiced, however rarely the
  # policy reaches it from the start box), the rest anywhere.
  fail_start_prob: 0.35
  fail_backoff_m: [0.5, 6.0]
  fail_memory: 400          # failures remembered per layout
  section_start_prob: 0.45
  section_backoff_m: [0.5, 4.0]
  # Which obstacle a section start goes before: in proportion to its recent
  # failure rate (env.section_weights), mixed this much with uniform so the
  # obstacles already cleared keep some practice.  1.0 is v4's uniform pick.
  section_uniform_mix: 0.3
  section_weight_decay: 0.999   # per training episode: ~1000-episode memory
  # Of dealt starts, this share start exactly where a recent episode ended
  # pinned, stopped against what it hit, so backing out gets practiced:
  # v4 at 20M, 38 of 48 held-out runs ended pinned, and 61% of pinned cars
  # never commanded reverse before the run was cut.
  stuck_start_prob: 0.10
  # Throttle dither: below ~1 m/s the Arduino drives the ESC in bursts (bench:
  # 200-350 spur RPM sd around 150-500 RPM targets, README), the tachometer
  # reads zero half the time under 0.6 m/s and nothing under 0.3 m/s
  # (characterization section 0), so a slow target is only held on average.  The target the car actually chases wanders by this much
  # (m/s, 1 sigma, correlation time dither_tau_s), fading out between the
  # two speeds.
  dither_sd: 0.30
  dither_full_below: 1.0
  dither_gone_above: 1.5
  dither_tau_s: 0.3
  # Terminations.  Touching an obstacle is not one: the plant slides the car
  # along it.  An impact that takes more than crash_speed off the car in one
  # step is.
  crash_speed: 1.5          # m/s
  stall_speed: 0.25         # m/s, either direction
  stall_s: 2.5
  pinned_window_s: 3.0      # a stop this soon after a touch is "pinned",
                            # charged reward.pinned, not the stall one...
  pinned_s: 6.0             # ...and ends the run after this long stopped,
                            # not stall_s: reverse engages only after ~0.5 s
                            # under the tach floor, then it has to back off
                            # and drive on
  progress_window_s: 6.0    # end the run as a stall if it advanced less than...
  progress_window_m: 0.5    # ...this over the window (going round, not along)
  off_course_m: 2.2         # m from the centerline: left the lane (the bucket
                            # section and east corridor are ~3 m wide)
  # Frames the policy sees, in control steps back: now, 0.1, 0.5 and 1.0 s.
  # v4 had two frames 0.1 s apart and no idea how long it had been stuck or
  # where the hoop posts went once they left the camera's 110 deg.
  frame_offsets: [0, 2, 10, 20]
  memory_features: true     # observation.Memory: stopped time, ~2 s mean
  memory_tau_s: 2.0         # speed, controller direction (tach only)

sensor:
  bins: 36
  fov_deg: 110.0
  max_range: 6.0
  min_range: 0.30           # ZED minimum depth, as the segmenter's min_depth
  vfov_deg: 77.3            # 640 x 360 at 110 deg horizontal
  camera_forward: 0.315
  camera_height: 0.20
  ray_step: 0.02
  rays_per_bin: 2
  # zed_cloud_noise_node: sigma = a + b r^2 on every point; a bin reports the
  # nearest of many, which the speckle filter trims.  Refit from the fixtures.
  noise_a: 0.01
  noise_b: 0.008
  bin_noise_scale: 0.5
  dropout: 0.02             # fraction of bins reading max range
  phantom: 0.005            # fraction of bins reading a near phantom
  carwash_misread_range: 2.0   # m: beyond this the car wash can read solid
  carwash_misread_prob: 0.3
  attitude_noise_deg: 1.0   # IMU pitch/roll error used for leveling
  gate_max_range: 5.0
  gate_frame_margin_deg: 3.0

prior:
  # Follow-the-gap on the blocking scan, or the nearest visible gate's center.
  gate_gain: 1.1            # road-wheel rad per rad of gate bearing
  gap_gain: 1.1             # road-wheel rad per rad of gap bearing
  gap_min_depth: 1.5        # m: a bin this deep or deeper is "open"
  straight_bias: 0.15       # prefer gaps near dead ahead
  yaw_damping: 0.45         # road-wheel rad per rad/s of yaw rate (swept, see prior_sweep)
  residual_scale: 1.0       # policy steering = prior + this * a0; v1's 0.5
                            # could not turn in early enough for the helix
  smoothing_s: 0.15         # low-pass on the prior's command

reward:
  progress: 6.0             # per meter of centerline
  time: 3.0                 # per second; break-even 0.5 m/s
  hoop: 20.0                # per hoop threaded
  hoop_align: 8.0           # potential at dead center, in the last...
  hoop_align_window_m: 2.5  # ...this far before an unthreaded hoop, falling
  hoop_align_cap_m: 0.6     # to 0 this far off its center line
  finish: 150.0             # must beat a fast run that crashes near the end
  finish_pace: 4.0          # per second under target_lap_s: every second counts
  target_lap_s: 90.0
  bump: 6.0                 # times (m/s lost to contact)^2
  crash: -60.0
  pinned: -45.0             # stuck, after pinned_s of the time cost: with
                            # that wait it must cost no more than a hard crash
                            # (reward.py), or crawling beats touching again
  hoop_miss: -60.0
  stall: -70.0              # stopping is the worst way to end a run
  off_course: -60.0
  graze: 8.0                # per s, times bite^2
  graze_band: 0.12          # m
  steer_rate: 0.01          # * dcmd^2 / dt
  steer_jerk: 0.005         # * ddcmd^2 / dt.  Both are charged on the sampled
                            # action, so they also tax exploration noise: at
                            # 0.04 / 0.05 that tax was ~20/s against a 3/s
                            # time cost, and the policy escaped it by holding
                            # the steering at full lock (v4 smoke).  Sawing
                            # +/-1 every step still costs ~48/s.
  speed_rate: 0.002         # * (d speed cmd, m/s)^2 / dt: 0.5 a step for
                            # flipping stop <-> full, nothing for a 4 m/s^2 ramp
  lateral: 0.0              # off by default: randomized buckets need a free line

randomize:
  enabled: true
  dead_time: [0.13, 0.26]
  coast_scale: [0.80, 1.20]
  accel_scale: [0.80, 1.20]
  slew_scale: [0.75, 1.25]
  steer_gain: [0.82, 1.10]
  steer_asymmetry: [0.85, 1.15]
  steer_offset: [-0.035, 0.035]
  steer_limit: [0.38, 0.55]
  understeer: [0.0, 0.02]
  scrub_scale: [0.90, 1.15]
  yaw_tau_scale: [0.6, 1.6]
  steering_tau: [0.04, 0.08]
  action_dropout: [0.0, 0.05]
  # New for this course: surface grip and the suspension.  mu_scale multiplies
  # the surface mu (1.0 floor, 0.35 gravel) -- refit by fit_surfaces.py.
  mu_scale: [0.80, 1.10]
  spring_scale: [0.85, 1.15]
  damping_scale: [0.75, 1.30]
  reverse_wait: [0.45, 0.70]    # s; bench: +1200 -> -1200 RPM began 1.15 s after
  dither_scale: [0.5, 1.5]
  yaw_rate_noise: [0.0, 0.03]   # rad/s, 1 sigma
  speed_noise: [0.0, 0.05]      # m/s, 1 sigma, above the tach floor

train:
  total_steps: 150000000   # ~8 h at 5.5k steps/s
  n_envs: 256
  n_steps: 64
  batch_size: 4096
  n_epochs: 4
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.001           # small: the std is bounded by log_std_range now;
                            # v2's 0.005 grew an unbounded speed std to 1.48
  reward_scale: 0.1         # rewards as PPO sees them; keeps value targets
                            # of order 1 (train.py sb3_adapter)
  learning_rate: 3.0e-4
  lr_final_fraction: 0.05
  net_arch: [128, 128]
  log_std_init: -1.5            # std 0.22: exploration noise must stay cheap
                                # next to the time cost (reward.py check)
  log_std_range: [-2.0, -0.5]   # std 0.135..0.61, sigmoid-bounded (ppo_policy.py).
                                # v4's floor was -2.5 (0.082): std slid onto it by
                                # 40M, when progress stalled, leaving +-0.19 m/s
                                # of speed noise -- too little to try reversing
  eval_every_steps: 2000000
  eval_episodes_per_layout: 12
  # Per obstacle, on the held-out layouts: dealt just before it, does the
  # policy get through?  Measures every obstacle before laps finish.
  section_eval_per_layout: 2

# Generated by generate_obstacle_course.py -- do not edit by hand.
#
# Bounds for the elements the course varies between runs, in world metres.
# The randomiser reads them from here so that it and the world cannot drift
# apart when the DXF changes.
obstacle_randomizer:
  ros__parameters:
    world: cfr_obstacle_course
    # 0 draws a count in [count_min, count_max]; anything else is used as is.
    bucket_count: 0
    # -1 draws a fresh seed on every randomize call.
    seed: -1
    buckets:
      # The section the buckets may stand in.  wall_clearance shrinks it by
      # the gap the drawing keeps between a bucket and the bale walls; every
      # bucket in the drawing sits exactly that far off the nearest wall.
      region_min: [-0.6520, -4.6288]
      region_max: [3.0087, -0.8783]
      wall_clearance: 0.7620
      min_spacing: 0.9144
      count_min: 2
      count_max: 9
      default_count: 6
      # Buckets a draw leaves out stand here, off the course, spaced along -x.
      parking: [-0.7574, 3.5371]
      parking_pitch: 0.5
      # Where the drawing itself puts them; the reset service restores these.
      nominal:
          bucket_0: [2.1586, -3.8653]
          bucket_1: [0.2789, -3.8653]
          bucket_2: [0.6346, -1.6427]
          bucket_3: [2.1626, -1.9353]
          bucket_4: [0.1265, -2.4300]
          bucket_5: [1.2186, -3.8653]
    hoops:
      names: [hoop_0, hoop_1, hoop_2]
      hoop_0:
        yaw: 1.57080
        from: [-3.9405, -1.0709]
        to: [-3.9405, -2.8997]
        nominal: [-3.9405, -1.7118]
        base_length: 0.709
      hoop_1:
        yaw: 1.57080
        from: [-6.3703, -1.0709]
        to: [-6.3703, -2.8997]
        nominal: [-6.3703, -2.4049]
        base_length: 0.709
      hoop_2:
        yaw: 0.00000
        from: [-7.5868, 0.1489]
        to: [-9.4156, 0.1489]
        nominal: [-8.1350, 0.1489]
        base_length: 0.709
    start_signal:
      # Joint setpoint topic, bridged from Gazebo by
      # simulation.launch.py.  The randomiser ramps the setpoint
      # across it rather than commanding the far end, so the arm
      # turns at a stated rate instead of as fast as it can.
      topic: /start_signal/arm
      red_angle: 0.00000
      green_angle: 1.57080
      # Where the signal stands, for reference; the arm is moved
      # through the joint, so nothing here is commanded as a pose.
      pose: [3.4000, 1.4000, 0.8130]
      yaw: -1.24175

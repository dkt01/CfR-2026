# Generated by generate_obstacle_course.py -- do not edit by hand.
#
# Bounds for the elements the course varies between runs, in world meters.
# The randomizer reads them from here so that it and the world cannot drift
# apart when the DXF changes.
obstacle_randomizer:
  ros__parameters:
    world: cfr_obstacle_course
    # 0 draws a count in [count_min, count_max]; anything else is used as is.
    bucket_count: 0
    # -1 draws a fresh seed on every randomize call.
    seed: -1
    buckets:
      # The section the buckets may stand in.  wall_clearance shrinks it by
      # the gap the drawing keeps between a bucket and the bale walls; every
      # bucket in the drawing sits exactly that far off the nearest wall.
      region_min: [-0.6520, -4.6288]
      region_max: [3.0087, -0.8783]
      wall_clearance: 0.7620
      min_spacing: 0.9144
      count_min: 2
      count_max: 9
      default_count: 6
      # Buckets a draw leaves out stand here, off the course, spaced along -x.
      parking: [-0.7574, 3.5371]
      parking_pitch: 0.5
      # Where the drawing itself puts them; the reset service restores these.
      nominal:
          bucket_0: [2.1586, -3.8653]
          bucket_1: [0.2789, -3.8653]
          bucket_2: [0.6346, -1.6427]
          bucket_3: [2.1626, -1.9353]
          bucket_4: [0.1265, -2.4300]
          bucket_5: [1.2186, -3.8653]
    gap_bales:
      # The bucket section's east wall, where the car enters it from the
      # east corridor, is four bale-widths tall.  Exactly one of the four
      # stands off-course at `parking` on every draw, leaving a one-bale gap
      # for the entrance; the other three stand at their own position on the
      # wall.  `default_gap` is which one is left out on reset, matching the
      # opening the drawing shows.
      names: [gap_bale_0, gap_bale_1, gap_bale_2, gap_bale_3]
      default_gap: gap_bale_0
      parking: [-5.2574, 3.5371]
      gap_bale_0:
        position: [3.2374, -1.3839]
        yaw: 4.71239
      gap_bale_1:
        position: [3.2374, -2.3540]
        yaw: 4.71239
      gap_bale_2:
        position: [3.2374, -3.2176]
        yaw: 4.71239
      gap_bale_3:
        position: [3.2374, -4.0812]
        yaw: 4.71239
    wide_bales:
      # The Wide Section, drawn as "approx 11' x 26' open area with
      # changeable boundaries": these bales stand anywhere inside `bounds`
      # at any yaw, never overlapping `walls`, `keep_out` or each other,
      # and always leaving a path min_track_width wide (the course's 20 in
      # guarantee) from `entry`, where the potholes lane opens into the
      # section, to whichever gap_bales slot is open.  `exit` is the path's
      # end when there are no gap bales.  `walls` are the fixed bales
      # around the section as flat (x, y, yaw, length, width) groups;
      # `keep_out` is the potholes lane's mouth.  `nominal` is the
      # drawing's pose, restored by ~/reset.
      names: [wide_bale_107, wide_bale_112, wide_bale_113, wide_bale_114, wide_bale_115, wide_bale_116, wide_bale_117]

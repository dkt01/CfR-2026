# Generated by generate_speed_course.py -- do not edit by hand.
#
# The Speed Course varies nothing between runs except the start signal,
# so obstacle_randomizer_node runs here with only its signal services
# live; randomize and reset have nothing to move and say so.
obstacle_randomizer:
  ros__parameters:
    world: cfr_speed_course
    start_signal:
      # Joint setpoint topic, bridged from Gazebo by
      # simulation.launch.py.  The randomizer ramps the setpoint
      # across it rather than commanding the far end, so the arm
      # turns at a stated rate instead of as fast as it can.
      topic: /start_signal/arm
      red_angle: 0.00000
      green_angle: 1.57080
      # Where the signal stands, for reference; the arm is moved
      # through the joint, so nothing here is commanded as a pose.
      pose: [17.0116, 3.8895, 0.8130]
      yaw: 1.57080

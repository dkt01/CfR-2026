/**:
  ros__parameters:
    use_sim_time: false

arduino_bridge:
  ros__parameters:
    # Serial link.  115200 rather than faster: see Onboard Protocol in the top
    # level README for why a higher rate loses Jetson frames.
    device: /dev/ttyACM0
    baud: 115200
    tx_rate_hz: 50.0        # Arduino drops to neutral after 200 ms of silence
    boot_delay: 2.0         # Uno bootloader window after the port is opened
    reconnect_period: 1.0
    # Debug trace: each line is the exact frame accepted by the USB serial
    # write.  Clear this after diagnosing command instability.
    tx_trace_path: /tmp/cfr-arduino-tx.log
    # Captures each complete newline-delimited status or diagnostic line read
    # from the Uno, including its debug lines and, with speed_trace on, the
    # speed controller's per-tick trace.
    rx_trace_path: /tmp/cfr-arduino-rx.log

    # Watchdogs
    command_timeout: 0.2    # zero speed if the autonomy stack goes quiet
    link_timeout: 0.5       # link_ok drops if no status frame arrives

    # Limits.  DriveCommand.velocity is clamped to max_speed and rate limited
    # by speed_slew_rate before it becomes the Arduino's speed target.  The
    # Arduino separately caps the throttle pulse at speed_output_limit.
    max_speed: 8.0          # m/s
    max_steering: 1.0
    speed_slew_rate: 2.0    # m/s per second, both directions

    # Flip if the servo or drive is wired opposite to the assumed convention.
    invert_steering: false
    invert_speed: false

    # Bench testing only: set false to pass commands through without waiting
    # for the Arduino to report AUTO_ACTIVE.
    require_auto_active: true

    # Drivetrain, for converting between m/s and the Arduino's spur RPM in both
    # directions.  The Slash 4X4 reduces spur to wheel 2.85:1 whatever pinion is
    # fitted.  Tire is the Traxxas 6764 Gravix 2.8" at a nominal 4.5" outer
    # diameter - calibrate with a measured roll-out.
    spur_to_wheel_ratio: 2.85
    tire_diameter: 0.1143   # meters

    # Arduino speed controller, see "Speed controller tuning" in
    # jetson/README.md.  Output is throttle pulse microseconds (us) from the
    # 1500 us neutral.  These may be changed at runtime with `ros2 param set`.
    #
    # TUNED WITH THE CAR ON BLOCKS.  Expect speed_ks/speed_kv to rise and
    # speed_kp/speed_ki to need retuning with the car on the ground.
    speed_ks: 28.0           # us whenever the target is nonzero
    speed_kv: 4.52           # us per m/s of target
    speed_kp: 7.62           # us per m/s of error
    speed_ki: 4.76           # us per m/s of error, per second
    speed_kd: 0.0            # us per m/s per second of measured speed change
    speed_i_limit: 60.0      # us
    speed_output_limit: 128.0  # us, at most 500
    speed_brake_limit: 0.0   # us, at most 440; 0 coasts instead of braking
    speed_trace: false       # per-tick controller trace into rx_trace_path
    gains_resend_period: 1.0 # s between resends until the Arduino applies them

cmd_vel_to_drive:
  ros__parameters:
    wheelbase: 0.324               # Traxxas Slash 4X4, meters
    max_speed: 8.0                 # m/s that maps to full throttle
    max_steering_angle: 0.40       # rad at full lock
    min_speed_for_steering: 0.3    # floor speed for the bicycle model
    cmd_timeout: 0.3
    publish_rate_hz: 50.0

sim_vehicle:
  ros__parameters:
    # The simulated car holds the commanded velocity, and models a zero target
    # as a coast rather than a zero wheel-speed command.  Lower deceleration
    # makes the simulated Slash roll farther after the target returns to zero.
    # Gazebo's tire contact brakes forward motion more than reverse, so these
    # command-side values compensate to make world-space coast distance
    # symmetric.
    neutral_speed_deadband: 0.05  # m/s
    neutral_coast_deceleration: 0.3  # m/s^2 fallback for both directions
    forward_neutral_coast_deceleration: 0.1  # m/s^2
    reverse_neutral_coast_deceleration: 0.3  # m/s^2

path_follower:
  ros__parameters:
    # Keep these well below cmd_vel_to_drive's max_speed/max_steering_angle:
    # path_follower has no obstacle awareness, it only tracks odometry.
    cruise_speed: 3.2          # m/s on a STRAIGHT segment
    turn_speed: 3.2            # m/s on a TURN segment (must stay nonzero, see path_geometry.hpp)
    turn_rate: 2.0             # rad/s commanded on a TURN segment
    heading_kp: 0.5            # P gain holding heading during a STRAIGHT segment
    heading_deadband: 0.01     # rad, ignore stationary ZED yaw noise below ~0.6 deg
    max_angular: 0.10          # rad/s clamp; limits steering response to ZED yaw noise
    decel_distance: 0.3        # m, start slowing within this of a STRAIGHT target
    decel_angle: 0.3           # rad, start slowing within this of a TURN target
    min_creep_speed: 0.08      # m/s floor while decelerating a STRAIGHT segment
    min_turn_rate: 0.15        # rad/s floor while decelerating a TURN segment
    distance_tolerance: 0.03   # m, STRAIGHT segment considered complete within this
    angle_tolerance: 0.02      # rad (~1.1 deg), TURN segment considered complete within this
    control_rate_hz: 20.0
    odom_timeout: 0.5          # s, abort the path if odometry goes stale
    max_segment_duration: 20.0 # s, abort a segment that hasn't completed (wheel slip, stuck odometry)
    keep_auto_active_when_idle: true

start_signal_detector:
  ros__parameters:
    # Where in the frame to look, as fractions [x_min, y_min, x_max, y_max].
    # The arm stands above the camera's horizon, which for a level camera is
    # the middle row, and below that is ground -- turf and dirt, close enough
    # to the green band to be worth not looking at.  Narrowing this around
    # where the signal actually lands is the cheapest way to make a busy
    # course easier.
    region: [0.0, 0.0, 1.0, 0.5]
    # Hue in degrees, [low, high]; red wraps through 0.  Drawn to clear what
    # an outdoor course puts in frame: skin at 20..35, straw and dry grass at
    # 30..50, turf and foliage at 80..110, the signal's own oasis blue board
    # at 198.  Red reaches back to 338 rather than forward, because open
    # shade is lit blue and takes red towards magenta.  The arms render at
    # 5 and 114.  Poppy Red drifts towards orange under direct-sun clipping,
    # so red's upper bound leaves only 4 degrees to skin rather than 8; Leafy
    # Green sits close enough to real foliage that green's lower bound leaves
    # no margin below it at all, relying on the arm's size and place to keep
    # foliage out where hue alone no longer does.
    red_hue: [338.0, 16.0]
    green_hue: [110.0, 175.0]
    # Color floors.  Chroma -- how far from gray a pixel is -- is the one
    # that does the work, because glare behind the signal and clipping in the
    # sun both add light to every channel, which costs saturation and leaves
    # chroma alone; exposure scales every channel, which costs chroma and
    # leaves saturation alone.  0.03 is about eight levels of an 8-bit
    # channel, close to a tenth of what Leafy Green -- the less saturated of
    # the two arms -- renders at.
    # Saturation is then only there to reject gray, so it is low: the
    # evidence that a candidate is the signal is its size and its place.
    min_saturation: 0.15
    min_chroma: 0.03
    min_value: 0.05             # only drops what is too black to have a hue
    # The arm is about 21 x 16 px at the 3 m both courses stand the signal
    # at, and a good deal less part way round.  Counted within one
    # cluster_window box, so scattered matches do not add up to an arm.
    min_pixels: 12
    cluster_window: 24          # px
    # How far the same color may spread past that window before the
    # candidate is thrown out as part of something much larger than an arm.
    # An arm inside its window scores 1.0, one that overfills it scores its
    # own area over the window's -- 2.3 for the 42 x 32 px the arm subtends
    # on the ZED's 1280 x 720 -- and a shirt or a hedge scores 3.8 or more.
    # So cluster_window above has to be about the arm's size in frame.
    max_spread: 3.0
    candidates: 6               # places of each color tracked per frame
    # The fraction of the color floors that applies inside the box around a
    # signal already found.  A known place is read on weaker evidence, which
    # is what gets a backlit arm read; the size gates do not relax.  Leafy
    # Green's own saturation leaves little room once it is backlit, which is
    # why this sits lower than a more saturated green would need.
    focus_relaxation: 0.4
    confirm_frames: 2           # 133 ms at the camera's 15 Hz
    # Frames of red in one place before it is taken for the signal.  The car
    # stands at the line for as long as it takes, so this is free.
    arm_frames: 5
    require_red_first: true     # a start is a transition, not just green
    max_transition_distance: 60.0  # px between the red arm and the green one
    forget_frames: 30           # frames before a place that has gone is dropped
    image_timeout: 3.0          # s without a frame before saying so
    debug_image: false          # annotated frames on ~/debug_image, for tuning
    debug_image_period: 0.2     # s

lap_counter:
  ros__parameters:
    # NOTE: target_laps, require_go and require_auto_active are deliberately
    # absent from this block, and must not be added to it.  The launch files
    # set them -- `laps:=` and `free_run:=` -- and a launch parameter dict
    # reaches the node as a `/**` wildcard entry, which rcl ranks BELOW a
    # node-specific block like this one.  Naming them here would silently
    # beat the launch argument, and even `-p target_laps:=2` on the command
    # line.  Their defaults live in lap_counter_node.py instead: three laps,
    # arm on the start signal, count only under AUTO_ACTIVE.  The parameters
    # below are tuning, which nothing overrides at launch, so they belong
    # here.
    #
    # The car waits behind the line, so it crosses it once on the way out --
    # that pass starts the run and is not counted, and three laps is four
    # crossings in all.

    # How far ahead of the parked car the line sits.  Both generated courses
    # put it at 0.70 m (generate_speed_course.py's LINE_AHEAD_OF_CAR, and the
    # obstacle course's VEHICLE_START), but nothing marks it on the speed
    # course, so measure it at the venue and set it here rather than trusting
    # the simulator.
    line_offset: 0.70

    # A crossing only scores if the car is travelling within this of the way
    # it was pointing when the run started.  This is the gate that rejects the
    # oval's far side, which passes through the plane of the line too, 14 m out
    # and going the other way -- and it rejects it because of the direction
    # rather than the distance, so it does not care how wide the course is.
    # 60 degrees is loose enough for a car still unwinding out of the last
    # corner and nowhere near the 180 degrees the return leg sits at.
    heading_tolerance: 1.05     # rad

    # A lap is at least this long.  Both courses are about ten times this, so
    # the gate is doing one job: stopping a car that halts astride the line
    # from scoring again every time it twitches forward.
    min_lap_distance: 10.0      # m

    # Optional cross-track backstop, for a course that runs a second leg
    # parallel to the start straight in the same direction.  Zero disables it,
    # which is the default -- a distance gate is a claim about the course's
    # shape, and the course built on the day will not match the drawing.
    lateral_gate: 0.0           # m

    # A step larger than this between pose samples is the SDK closing a loop
    # or recovering tracking, not the car driving.  Reported, and kept out of
    # the distance travelled so it cannot push a short lap past the gate
    # above.  At 8 m/s and the ZED's 30 Hz a real step is 0.27 m.
    max_step: 1.0               # m

    # How far the car may be from where it was e-stopped before the distance
    # it had driven is thrown away.  Pausing in place keeps the lap; being
    # lifted past an obstacle and set down starts the lap distance again, so a
    # car put down behind the line cannot score on the way back over it with
    # travel from before the stop.
    carry_tolerance: 0.5        # m

    pose_timeout: 0.5           # s without a pose before saying so
    status_timeout: 1.0         # s before Arduino status is treated as gone
